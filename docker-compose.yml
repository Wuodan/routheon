# Demo Setup
#
# Starts a proxy on host port 8080 plus 2 llama.cpp servers
# Routing is based on API_KEY (OpenAI compatible)
services:
  traefik-proxy:
    image: traefik:latest
    depends_on:
      llama-server-1:
        condition: service_healthy
      llama-server-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
    ports:
      - "8080:8080"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./mappings:/etc/traefik/mappings/:ro

  llama-server-1:
    image: ghcr.io/ggml-org/llama.cpp:server
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8011/v1/health" ]
      start_period: 10m
    volumes:
      - llama_cpp:/models:/models
    environment:
      LLAMA_CACHE: /models/llama-cache
    command: |
      --hf-repo TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF:Q2_K
      -n 512
      --port 8011
      --host 0.0.0.0
      --alias TinyLlama_Q2
      --verbose

  llama-server-2:
    image: ghcr.io/ggml-org/llama.cpp:server
    depends_on:
      # prevent parallel initial download of model
      llama-server-1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8012/v1/health" ]
      start_period: 10m
    volumes:
      - llama_cpp:/models:/models
    environment:
      LLAMA_CACHE: /models/llama-cache
    command: |
      --hf-repo tensorblock/mistral-1L-tiny-GGUF:Q2_K
      -n 512
      --port 8012
      --host 0.0.0.0
      --alias mistral-tiny_Q2
      --verbose

volumes:
  llama_cpp:
